name: verify

# Runs on pushes to main only, and never for a push that touches nothing but run checkpoints, banked score
# vectors or heartbeat files: a preregistered run commits checkpoints every half hour and each of those pushes
# used to cost a full ~10-minute run on two branches (2026-09-09: 1805 of the month's 2000 included minutes
# spent). Pushes to feature branches do not run CI; run `bash tools/gates.sh` locally, or trigger this
# workflow by hand from the Actions tab (workflow_dispatch) when a branch needs a public check.
on:
  push:
    branches: [main]
    paths-ignore:
      - "artifacts/pivot/*_ckpt/**"
      - "artifacts/pivot/*_scores.json"
      - "**/*.hb"
  workflow_dispatch:

# A newer push to main supersedes a run still in progress on the same branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrument:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pivot.txt

      - name: Install dependency floors
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Every gate, in one command (tools/gates.sh - the same script run locally)
        run: bash tools/gates.sh

      - name: Fetch the ten source texts and pin them to the banked edition (fails on drift)
        run: bash tools/pivot/fetch_sources.sh

      - name: Corpus determinism probe (small slice built twice + order-shuffled, hashes must match; refuses without source bytes)
        run: |
          python3 -m pip install --quiet -r requirements-pivot.txt
          python3 tools/ci/determinism_probe.py

      - name: Mutation report must show zero surviving mutations
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("artifacts/verification/mutation_report.json"))
          print(f"{r['detected']}/{r['total_mutations']} detected, {r['survived']} survived")
          sys.exit(1 if r["survived"] else 0)
          PY
