# Public mirror: manual runs only (workflow_dispatch); the private repository runs this on pushes to main.
name: verify

# Manual runs only (Actions tab -> verify -> Run workflow). Until 2026-09-09 this ran on every push to every
# branch and a preregistered run pushed checkpoints to two branches every half hour, which spent 1805 of the
# month's 2000 included Actions minutes; the owner asked for no further automatic usage. Every gate this job
# runs is run locally by `bash tools/gates.sh` before each push to main, and that command is the check a
# stranger runs on a clone. Re-enable automatic runs by adding `push: {branches: [main]}` under `on:`.
on:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrument:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-pivot.txt

      - name: Install dependency floors
        run: python3 -m pip install --quiet -r requirements.txt

      - name: Every gate, in one command (tools/gates.sh - the same script run locally)
        run: bash tools/gates.sh

      - name: Fetch the ten source texts and pin them to the banked edition (fails on drift)
        run: bash tools/pivot/fetch_sources.sh

      - name: Corpus determinism probe (small slice built twice + order-shuffled, hashes must match; refuses without source bytes)
        run: |
          python3 -m pip install --quiet -r requirements-pivot.txt
          python3 tools/ci/determinism_probe.py

      - name: Mutation report must show zero surviving mutations
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("artifacts/verification/mutation_report.json"))
          print(f"{r['detected']}/{r['total_mutations']} detected, {r['survived']} survived")
          sys.exit(1 if r["survived"] else 0)
          PY
